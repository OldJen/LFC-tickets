<head>
<meta charset="UTF-8" />

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: oklch(0.38 0.16 22);
    --accent-hover: oklch(0.35 0.15 22);
    --page-bg: oklch(0.96 0.005 20);
    --ink: oklch(0.22 0.015 20);
    --ink-input: oklch(0.25 0.015 20);
    --ink-muted: oklch(0.5 0.02 20);
    --ink-muted-2: oklch(0.52 0.02 20);
    --ink-subtle: oklch(0.55 0.02 20);
    --ink-faint: oklch(0.58 0.02 20);
    --month-label: oklch(0.45 0.02 20);
    --border: oklch(0.91 0.008 20);
    --border-strong: oklch(0.89 0.008 20);
    --border-tab: oklch(0.88 0.008 20);
    --border-dashed: oklch(0.86 0.01 20);
    --border-empty: oklch(0.82 0.012 20);
    --border-hover: oklch(0.84 0.01 20);
    --border-hairline: oklch(0.4 0.02 20 / 0.3);
    --surface-muted: oklch(0.975 0.004 20);
    --surface-locked: oklch(0.955 0.005 20);
    --score-bg: oklch(0.28 0.02 20);
    --focus-ring: oklch(0.55 0.14 22);
    --past-ink: oklch(0.45 0.02 20);
    --past-dim: oklch(0.6 0.02 20);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter Tight", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--page-bg);
    color: var(--ink);
  }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }

  .loading-state, .error-state {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-subtle);
  }
  .error-state { color: oklch(0.5 0.18 25); }
  .error-state .error-detail { color: var(--ink-faint); margin-top: 10px; }

  .page { min-height: 100vh; padding-bottom: 64px; }

  .header { background: var(--accent); color: #fff; padding: 26px 24px 22px; }
  .header-inner {
    max-width: 880px; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .badge {
    width: 40px; height: 40px; border-radius: 6px; background: #fff; flex: none;
    display: grid; place-items: center;
    font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 22px;
    color: var(--accent); letter-spacing: -0.5px;
  }
  .title { font-family: "Barlow Condensed", sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; line-height: 1; }
  .subtitle { font-size: 13px; opacity: 0.82; margin-top: 3px; }
  .stats { display: flex; gap: 26px; }
  .stat-value { font-family: "Barlow Condensed", sans-serif; font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; opacity: 0.75; margin-top: 2px; }

  .filters {
    position: sticky; top: 0; z-index: 5;
    background: oklch(0.96 0.005 20 / 0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-tab); padding: 12px 24px;
  }
  .filters-inner { max-width: 880px; margin: 0 auto; display: flex; flex-wrap: nowrap; align-items: center; gap: 16px; }
  .tabs {
    display: flex; flex-wrap: nowrap; gap: 8px; flex: 1; min-width: 0;
    overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
    mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), transparent 100%);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
    font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; flex: none;
    background: #fff; color: oklch(0.35 0.02 20); border: 1px solid var(--border-tab);
    transition: all 0.14s ease;
  }
  .tab:hover { border-color: oklch(0.6 0.05 20); }
  .tab-active, .tab-active:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab-count { opacity: 0.55; font-variant-numeric: tabular-nums; }

  .toggle { display: flex; align-items: center; gap: 9px; padding: 4px; border: none; background: transparent; cursor: pointer; font-family: inherit; margin-left: auto; }
  .toggle-label { font-size: 12.5px; font-weight: 500; color: var(--ink-subtle); transition: color 0.16s ease; }
  .toggle[aria-checked="true"] .toggle-label { color: oklch(0.38 0.02 20); }
  .toggle-track {
    position: relative; flex: none; width: 36px; height: 21px; border-radius: 999px;
    background: oklch(0.85 0.01 20); transition: background 0.18s ease;
  }
  .toggle-track.toggle-on { background: var(--accent); }
  .toggle-knob {
    position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px oklch(0.3 0.02 20 / 0.3); transition: left 0.18s ease;
  }
  .toggle-track.toggle-on .toggle-knob { left: 17px; }

  .content { max-width: 880px; margin: 0 auto; padding: 0 24px; }
  .empty-state { font-size: 13px; color: var(--ink-faint); text-align: center; padding: 48px 0; }

  .month-group { margin-top: 30px; }
  .month-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .month-label {
    font-family: "Barlow Condensed", sans-serif; font-size: 17px; font-weight: 700;
    letter-spacing: 1.6px; text-transform: uppercase; color: var(--month-label); white-space: nowrap;
  }
  .month-rule { flex: 1; height: 1px; background: var(--border-strong); }
  .rows { display: flex; flex-direction: column; gap: 8px; }

  .card {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 10px 14px; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    transition: box-shadow 0.16s ease, border-color 0.16s ease;
  }
  .card-upcoming { border-left: 3px solid var(--accent); }
  .card-upcoming:hover { box-shadow: 0 4px 14px oklch(0.4 0.03 20 / 0.1); border-color: var(--border-hover); }
  .card-played {
    background: transparent; border: none; border-radius: 0;
    border-bottom: 1px dashed var(--border-dashed); border-left: 3px solid transparent;
    padding: 10px 14px 10px 11px;
  }

  .card-left { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1 1 260px; }
  .date-rail { flex: none; width: 62px; text-align: center; border-right: 1px solid var(--border); padding-right: 12px; }
  .dow { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-faint); }
  .day-num { font-family: "Barlow Condensed", sans-serif; font-size: 24px; line-height: 1.05; font-weight: 700; color: var(--ink); }
  .time { font-size: 11px; color: var(--ink-subtle); font-variant-numeric: tabular-nums; }
  .postponed-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.4px; color: var(--accent); }

  .card-played .dow, .card-played .time { color: var(--past-dim); }
  .card-played .day-num { color: var(--past-ink); font-weight: 600; }

  .opponent { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 auto; padding-bottom: 16px; }
  .kit-col { flex: none; width: 34px; position: relative; }
  .kit-swatch { width: 34px; height: 34px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .card-played .kit-swatch { filter: saturate(0.8); }
  .kit-abbr {
    position: absolute; top: 100%; left: 0; width: 100%; margin-top: 3px; text-align: center;
    font-family: "Barlow Condensed", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; color: var(--ink-muted); line-height: 1;

  .text-col { min-width: 0; }
  .name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .name { font-size: 17px; letter-spacing: -0.2px; font-weight: 600; color: var(--ink); }
  .card-played .name { font-weight: 500; color: var(--past-ink); }
  .score-chip {
    flex: none;
    font-family: "Barlow Condensed", sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 1px;

  .comp-row { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
  .comp-name { font-size: 12px; color: var(--ink-muted); }
  .card-played .comp-name { color: var(--past-dim); }

  .seat { position: relative; z-index: 1; }
  .seat.seat-open { z-index: 60; isolation: isolate; }

  .seat-field {
    display: flex; align-items: center; gap: 2px; box-sizing: border-box;
    padding: 6px 5px 6px 11px; border-radius: 6px; width: 112px;
    background: #fff; border: 1px solid oklch(0.86 0.01 20); box-shadow: inset 0 -1px 0 var(--border-strong);
    transition: border-color 0.14s ease;
  }
  .seat-field-empty { background: var(--surface-muted); border: 1px dashed var(--border-empty); box-shadow: none; }
  .seat-field:focus-within { border-color: var(--focus-ring); }

  .seat-input {
    width: 100%; min-width: 0; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 13px; font-weight: 500; color: var(--ink-input); padding: 0;
  }
  .seat-caret {
    flex: none; width: 18px; height: 18px; display: grid; place-items: center;
    border: none; background: transparent; cursor: pointer; color: var(--ink-subtle); font-size: 9px; line-height: 1;
  }

  .seat-menu {
    position: absolute; top: calc(100% + 4px); left: 0; min-width: 100%; z-index: 20;
    background: #fff; border: 1px solid var(--border-tab); border-radius: 9px;
    box-shadow: 0 8px 22px oklch(0.35 0.03 20 / 0.14); padding: 4px;
    display: flex; flex-direction: column;
  }
  .seat-menu.menu-up { top: auto; bottom: calc(100% + 4px); }
  .seat-menu.hidden { display: none; }
  .seat-option {
    display: block; padding: 8px 14px; border-radius: 6px;
    font-family: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; text-align: left;
    border: none; background: transparent; color: var(--ink-input); cursor: pointer;
  }
  .seat-option:hover { background: oklch(0.96 0.006 20); }
  .seat-option-clear { border-top: 1px solid oklch(0.93 0.008 20); margin-top: 2px; padding-top: 9px; color: var(--ink-muted); }

  .seat-locked {
    display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    padding: 6px 12px; width: 112px; border-radius: 6px;
    font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: var(--surface-locked); border: 1px solid var(--border);
    color: var(--past-ink);
  }
  .seat-locked-empty { color: var(--past-dim); }

  .footnote { font-size: 12px; color: var(--ink-subtle); line-height: 1.6; margin-top: 28px; }

  @media (max-width: 640px) {
    .header { padding: 18px 16px 16px; }
    .badge { width: 34px; height: 34px; font-size: 18px; }
    .title { font-size: 24px; }
    .stat-value { font-size: 22px; }
    .filters { padding: 10px 16px; }
    .content { padding: 0 16px; }
    .card { padding: 8px 12px; }
    .card-played { padding: 8px 12px 8px 9px; }
    .date-rail { width: 46px; padding-right: 9px; }
    .kit-col, .kit-swatch { width: 30px; }
    .kit-swatch { height: 30px; }
    .name { font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-left { flex: 1 1 100%; }
    .seats { width: 100%; }
    .seat-field, .seat-locked { width: 104px; }
  }
</style>
</head>

function dayNum(dateStr) {

function monthLabel(dateStr) {

    return;
  }
  try {
    await setDoc(docRef, { fixtures, lastUpdated: new Date().toISOString(), version: DATA_VERSION });
  } catch (err) {
    console.error("Save failed", err);
  }
}

function updateTicket(id, field, value) {
  const next = currentFixtures.map((f) => (f.id === id ? { ...f, [field]: value } : f));
  saveFixtures(next);
}

function renderSeat(f, field) {
  const name = f[field] || "";
  const key = `${f.id}:${field}`;
  if (isPlayed(f)) {
    const label = name || "Unused";
    return `
      <div class="seat">
        <div class="seat-locked ${name ? "" : "seat-locked-empty"}">${escapeHtml(label)}</div>
      </div>`;
  }
  const options = ROSTER.map((person) => `
    <button type="button" class="seat-option" data-select="${escapeHtml(person)}">${escapeHtml(person)}</button>`
  ).join("") + (name ? `
    <button type="button" class="seat-option seat-option-clear" data-select="">Clear seat</button>` : "");
  return `
    <div class="seat" data-seat data-key="${escapeHtml(key)}">
      <div class="seat-field ${name ? "" : "seat-field-empty"}">
        <input type="text" class="seat-input" value="${escapeHtml(name)}" data-id="${escapeHtml(f.id)}" data-field="${field}" placeholder="Add name" aria-label="Ticket holder" autocomplete="off" />
        <button type="button" class="seat-caret" data-caret aria-label="Choose name">▾</button>
      </div>
      <div class="seat-menu hidden" data-menu>${options}</div>
    </div>`;
}

function renderRow(f) {
  const played = isPlayed(f);
  const postponed = f.status === "postponed";
  const club = CLUB_KITS[f.opponent] || DEFAULT_CLUB_KIT;
  const scoreHtml = played ? `<span class="score-chip">${f.score.home}–${f.score.away}</span>` : "";
  const timeHtml = postponed ? `<span class="postponed-tag">Postponed</span>` : escapeHtml(f.kickoff || "");

  return `
    <div class="card ${played ? "card-played" : "card-upcoming"}">
      <div class="card-left">
        <div class="date-rail">
          <div class="dow">${dowLabel(f.date)}</div>
          <div class="day-num">${dayNum(f.date)}</div>
          <div class="time">${timeHtml}</div>
        </div>
        <div class="opponent">
          ${scoreHtml}
          <div class="kit-col">
            <div class="kit-swatch" style="background:${club.kit}" title="${escapeHtml(f.opponent)}"></div>
            <div class="kit-abbr">${club.abbr}</div>
          </div>
          <div class="text-col">
            <div class="name-row">
              <span class="name">${escapeHtml(f.opponent)}</span>
            </div>
            <div class="comp-row">
              <span class="comp-name">${escapeHtml(f.competition)}</span>
            </div>
          </div>
        </div>
      </div>
      <div class="seats">
        ${renderSeat(f, "ticket1")}
        ${renderSeat(f, "ticket2")}
      </div>
    </div>`;
}

function render() {
  const comps = [];
  currentFixtures.forEach((f) => { if (!comps.includes(f.competition)) comps.push(f.competition); });
  const counts = {};
  comps.forEach((c) => { counts[c] = 0; });
  currentFixtures.forEach((f) => { counts[f.competition]++; });

  const filtered = currentFixtures.filter((f) => currentFilter === "All" || f.competition === currentFilter);
  const visible = filtered.filter((f) => showPastMatches || !isPlayed(f))
    .sort((a, b) => a.date.localeCompare(b.date));

  const groupOrder = [];
  const byMonth = new Map();
  visible.forEach((f) => {
    const label = monthLabel(f.date);
    if (!byMonth.has(label)) { byMonth.set(label, []); groupOrder.push(label); }
    byMonth.get(label).push(f);
  });

  const groupsHtml = groupOrder.map((label) => `
    <div class="month-group">
      <div class="month-head">
        <span class="month-label">${escapeHtml(label)}</span>
        <span class="month-rule"></span>
      </div>
      <div class="rows">${byMonth.get(label).map(renderRow).join("")}</div>
    </div>`).join("");

  const tabsHtml = ["All", ...comps].map((c) => {
    const isAll = c === "All";
    const count = isAll ? currentFixtures.length : counts[c];
    const label = isAll ? "All fixtures" : c;
    return `
      <button type="button" class="tab ${c === currentFilter ? "tab-active" : ""}" data-filter="${escapeHtml(c)}">
        <span>${escapeHtml(label)}</span>
        <span class="tab-count">${count}</span>
      </button>`;
  }).join("");

  const upcomingCount = currentFixtures.filter((f) => !isPlayed(f)).length;
  const assignedCount = currentFixtures.reduce((n, f) => n + (f.ticket1 ? 1 : 0) + (f.ticket2 ? 1 : 0), 0);

  document.getElementById("app").innerHTML = `
    <div class="page">
      <div class="header">
        <div class="header-inner">
          <div class="header-left">
            <div class="badge">LFC</div>
            <div>
              <div class="title">Home Tickets</div>
              <div class="subtitle">Anfield · ${seasonLabel()} season</div>
            </div>
          </div>
          <div class="stats">
            <div class="stat"><div class="stat-value">${upcomingCount}</div><div class="stat-label">Upcoming</div></div>
            <div class="stat"><div class="stat-value">${assignedCount}</div><div class="stat-label">Seats claimed</div></div>
          </div>
        </div>
      </div>

      <div class="filters">
        <div class="filters-inner">
          <div class="tabs">${tabsHtml}</div>
          <button type="button" class="toggle" id="pastToggle" role="switch" aria-checked="${showPastMatches}">
            <span class="toggle-label">Show results</span>
            <span class="toggle-track ${showPastMatches ? "toggle-on" : ""}"><span class="toggle-knob"></span></span>
          </button>
        </div>
      </div>

      <div class="content">
        ${groupsHtml || `<p class="empty-state">No fixtures in this competition yet.</p>`}
        <div class="footnote">Type any name into a seat, or use the ▾ to pick ${ROSTER.slice(0, -1).join(", ")} or ${ROSTER[ROSTER.length - 1]}.</div>
      </div>
    </div>`;

  wireInteractions();
}

function wireInteractions() {
  document.querySelectorAll(".tab").forEach((btn) => {
    btn.addEventListener("click", () => { currentFilter = btn.dataset.filter; render(); });
  });

  const toggle = document.getElementById("pastToggle");
  if (toggle) toggle.addEventListener("click", () => { showPastMatches = !showPastMatches; render(); });

  document.querySelectorAll("[data-seat]").forEach((seatEl) => {
    const input = seatEl.querySelector(".seat-input");
    const caret = seatEl.querySelector("[data-caret]");
    const menu = seatEl.querySelector("[data-menu]");

    const openMenu = () => {
      const up = window.innerHeight - input.getBoundingClientRect().bottom < 170;
      menu.classList.toggle("menu-up", up);
      menu.classList.remove("hidden");
      seatEl.classList.add("seat-open");
    };
    const closeMenu = () => {
      menu.classList.add("hidden");
      seatEl.classList.remove("seat-open");
    };

    input.addEventListener("focus", (e) => { e.target.select(); openMenu(); });
    input.addEventListener("blur", (e) => {
      const { id, field } = e.target.dataset;
      updateTicket(id, field, e.target.value.trim());
      setTimeout(closeMenu, 100);
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });

    caret.addEventListener("mousedown", (e) => e.preventDefault());
    caret.addEventListener("click", () => {
      if (menu.classList.contains("hidden")) input.focus(); else input.blur();
    });

    menu.querySelectorAll(".seat-option").forEach((opt) => {
      opt.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const value = opt.dataset.select;
        input.value = value;
        const { id, field } = input.dataset;
        updateTicket(id, field, value);
        closeMenu();
      });
    });
  });
}

/* ---------- Load + live sync ---------- */
async function init() {
  if (IS_LOCAL_PREVIEW) {
    // Fake data only - the live Firestore doc is never read or written from localhost.
    const FAKE_TICKETS = {
      "pl-20260829-nfo": { ticket1: "Kev", ticket2: "" },
      "ucl-20260909-atm": { ticket1: "Ian", ticket2: "Brian" },
      "pl-20260912-ful": { ticket1: "", ticket2: "Kev" },
    };
    currentFixtures = SEED_FIXTURES.map((f) => ({
      ...f,
      ticket1: FAKE_TICKETS[f.id]?.ticket1 ?? "Brian",
      ticket2: FAKE_TICKETS[f.id]?.ticket2 ?? "",
    }));
    render();
    return;
  }
  try {
    const snap = await getDoc(docRef);
    const stored = snap.exists() ? snap.data() : null;

    if (stored && stored.version === DATA_VERSION) {
      currentFixtures = stored.fixtures;
    } else {
      const storedFixtures = stored?.fixtures || [];
      const ticketMap = {};
      storedFixtures.forEach((f) => { ticketMap[f.id] = { ticket1: f.ticket1, ticket2: f.ticket2 }; });

      // A client running older code (older SEED_FIXTURES) must never erase fixtures
      // that newer code already saved - carry those forward untouched instead of dropping them.
      const knownIds = new Set(SEED_FIXTURES.map((f) => f.id));
      const unknownFixtures = storedFixtures.filter((f) => !knownIds.has(f.id));

      const merged = [
        ...SEED_FIXTURES.map((f) => ({
          ...f,
          ticket1: ticketMap[f.id]?.ticket1 ?? "Brian",
          ticket2: ticketMap[f.id]?.ticket2 ?? "",
        })),
        ...unknownFixtures,
      ];
      currentFixtures = merged;
      await saveFixtures(merged);
    }
    render();

    // Live sync: any change anyone makes reflects for everyone without a manual refresh
    onSnapshot(docRef, (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        if (JSON.stringify(data.fixtures) !== JSON.stringify(currentFixtures)) {
          currentFixtures = data.fixtures;
          render();
        }
      }
    });
  } catch (err) {
    document.getElementById("app").innerHTML = `<div class="error-state">
      Couldn't connect to storage. Check the Firebase config at the top of this file has been filled in correctly.
      <div class="error-detail">${escapeHtml(err.message)}</div>
    </div>`;
  }
}

init();
</script>
